name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --parallel 2

      - name: Run software tests
        run: ctest --test-dir build --output-on-failure -L software

  build-arm64:
    name: Build Raspberry Pi ARM64
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ libopencv-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build --target cerno_verdict --parallel 2

      - name: Verify binary architecture
        run: |
          file build/cerno_verdict
          file build/cerno_verdict | grep -q "ARM aarch64"

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cerno-verdict-arm64
          path: build/cerno_verdict
          if-no-files-found: error
