name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --parallel 2

      - name: Run software tests
        run: ctest --test-dir build --output-on-failure -L software

  build-arm64:
    name: Build Raspberry Pi ARM64
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ libopencv-dev file git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build --target cerno_verdict --parallel 2

      - name: Verify binary architecture
        run: |
          file build/cerno_verdict
          file build/cerno_verdict | grep -q "ARM aarch64"

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cerno-verdict-arm64
          path: build/cerno_verdict
          if-no-files-found: error

  release-arm64:
    name: Publish Raspberry Pi release
    needs:
      - build-and-test
      - build-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cerno-verdict-arm64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Cerno Verdict v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/cerno_verdict

  deploy:
    name: Deploy to Raspberry Pi
    needs:
      - build-and-test
      - build-arm64
      - release-arm64

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cerno-verdict-arm64
          path: dist

      - name: Check OIDC subject
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=debug-cerno-verdict"
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Issuer:", claims.get("iss"))
          print("Subject:", claims.get("sub"))
          PY

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:github-actions
          ping: 100.119.172.2

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cerno_deploy
          chmod 600 ~/.ssh/cerno_deploy
          ssh-keyscan -H 100.119.172.2 >> ~/.ssh/known_hosts

      - name: Transfer executable to Raspberry Pi
        run: |
          scp -i ~/.ssh/cerno_deploy \
            -o IdentitiesOnly=yes \
            dist/cerno_verdict \
            cerno-deploy@100.119.172.2:/home/cerno-deploy/incoming/cerno_verdict.new

      - name: Install and restart application
        run: |
          ssh -i ~/.ssh/cerno_deploy \
            -o IdentitiesOnly=yes \
            cerno-deploy@100.119.172.2 \
            'sudo -n /usr/local/sbin/deploy-cerno-verdict'
